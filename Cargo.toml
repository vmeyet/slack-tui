[package]
name = "slack"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Slack in your terminal, as yourself: a TUI plus scriptable commands."
license = "MIT"
repository = "https://github.com/vmeyet/slack-tui"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_complete = "4.6.11"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures-util = "0.3.31"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
indexmap = { version = "2.14.2", features = ["serde"] }
owo-colors = "4.4.0"
ratatui = "0.30.2"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "fs", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.6"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
futures-util = "0.3.31"
insta = "1.48.0"
predicates = "3.1.4"
tokio = { version = "1.53.1", features = ["test-util"] }
tokio-tungstenite = "0.30.0"
wiremock = "0.6.5"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
format_push_string = "allow"
implicit_hasher = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
struct_excessive_bools = "allow"
